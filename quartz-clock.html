// ─── Lighting ────────────────────────────────────────────────────────────────

key.position.set(8, 14, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 50;

key.shadow.bias = -0.0003;
scene.add(key);

scene.add(new THREE.DirectionalLight(0xa8c4e8, 0.35).translateX(-10).translateY(6).translateZ(-8));

rim.position.set(0, -2, 12);

const floorLight = new THREE.PointLight(0x3a2a18, 0.4, 30);

// ─── Materials ───────────────────────────────────────────────────────────────
const brass = new THREE.MeshStandardMaterial({ color: 0xb8975a, metalness: 0.85, roughness: 0.28 });

const steel = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, metalness: 0.95, roughness: 0.22 });
const polishedSteel = new THREE.MeshStandardMaterial({ color: 0xc8d0d8, metalness: 1.0, roughness: 0.12 });
const enamel = new THREE.MeshStandardMaterial({ color: 0xf4efe6, metalness: 0.05, roughness: 0.55 });
const blackEnamel = new THREE.MeshStandardMaterial({ color: 0x1a1814, metalness: 0.15, roughness: 0.4 });
const redHand = new THREE.MeshStandardMaterial({ color: 0xb83020, metalness: 0.4, roughness: 0.35 });
const wood = new THREE.MeshStandardMaterial({ color: 0x3d2b1a, metalness: 0.05, roughness: 0.75 });

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.AmbientLight(0xffffff, 0.6));
const envLight = new THREE.DirectionalLight(0xffe8c8, 1.2);
envLight.position.set(5, 10, 7);

// ─── Gear factory ────────────────────────────────────────────────────────────
function createGear(teeth, radius, thickness, hubRadius, material, toothDepth = 0.35) {
  const shape = new THREE.Shape();
  const outerR = radius;
  const innerR = radius - toothDepth;
  const step = (Math.PI * 2) / teeth;

  for (let i = 0; i < teeth; i++) {
    const a0 = i * step;
    const a1 = a0 + step * 0.28;
    const a2 = a0 + step * 0.5;
    const a3 = a0 + step * 0.72;
    const a4 = a0 + step;
    if (i === 0) shape.moveTo(Math.cos(a0) * outerR, Math.sin(a0) * outerR);
    else shape.lineTo(Math.cos(a0) * outerR, Math.sin(a0) * outerR);
    shape.lineTo(Math.cos(a1) * outerR, Math.sin(a1) * outerR);
    shape.lineTo(Math.cos(a2) * innerR, Math.sin(a2) * innerR);
    shape.lineTo(Math.cos(a3) * outerR, Math.sin(a3) * outerR);
    shape.lineTo(Math.cos(a4) * outerR, Math.sin(a4) * outerR);
  }
  shape.closePath();

  const hole = new THREE.Path();
  hole.absarc(0, 0, hubRadius, 0, Math.PI * 2, true);
  shape.holes.push(hole);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness,
    bevelEnabled: true,
    bevelThickness: 0.06,
    bevelSize: 0.05,
    bevelSegments: 2
  });
  geo.center();
  geo.rotateX(-Math.PI / 2);

  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.teeth = teeth;
  mesh.userData.radius = radius;
  return mesh;
}

function createSpokeWheel(radius, thickness, spokes, material, rimWidth = 0.25) {
  const group = new THREE.Group();
  const rimGeo = new THREE.TorusGeometry(radius - rimWidth / 2, rimWidth / 2, 10, 48);
  const rim = new THREE.Mesh(rimGeo, material);
  rim.rotation.x = Math.PI / 2;
  rim.castShadow = true;
  group.add(rim);

  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.18, radius * 0.18, thickness * 1.4, 20),
    material
  );
  hub.castShadow = true;
  group.add(hub);

  for (let i = 0; i < spokes; i++) {
    const angle = (i / spokes) * Math.PI * 2;
    const spoke = new THREE.Mesh(
      new THREE.BoxGeometry(radius * 0.9, thickness * 0.7, 0.12),
      material
    );
    spoke.position.x = Math.cos(angle) * radius * 0.45;
    spoke.position.z = Math.sin(angle) * radius * 0.45;
    spoke.rotation.y = -angle;
    spoke.castShadow = true;
    group.add(spoke);
  }
  return group;
}

function makeNumeralTexture(text) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 128);
  ctx.fillStyle = '#1a1814';
  ctx.font = 'bold 72px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 68);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

const numeralPositions = [
  { n: '12', a: -Math.PI / 2 },
  { n: '1',  a: -Math.PI / 2 + Math.PI / 6 },
  { n: '2',  a: -Math.PI / 2 + Math.PI / 3 },
  { n: '3',  a: 0 },
  { n: '4',  a: Math.PI / 6 },
  { n: '5',  a: Math.PI / 3 },
  { n: '6',  a: Math.PI / 2 },
  { n: '7',  a: Math.PI / 2 + Math.PI / 6 },
  { n: '8',  a: Math.PI / 2 + Math.PI / 3 },
  { n: '9',  a: Math.PI },
  { n: '10', a: Math.PI + Math.PI / 6 },
  { n: '11', a: Math.PI + Math.PI / 3 }
];

{

{

minuteHand.position.y = 0.50;
handsGroup.add(minuteHand);

const secondHand = new THREE.Group();
{

  blade.position.z = -2.1; blade.castShadow = true; secondHand.add(blade);

secondHand.position.y = 0.58;
handsGroup.add(secondHand);

// ─── Mechanical movement (enhanced gear train) ───────────────────────────────
const movement = new THREE.Group();
movement.position.set(0, -0.9, 0);
clockGroup.add(movement);

// ═══════════════════════════════════════════════════════════════════════════════
//  WEB AUDIO — mechanical tick / tock synthesis (no external files)
// ═══════════════════════════════════════════════════════════════════════════════
let audioCtx = null;
let masterGain = null;
let muted = false;
let soundEnabled = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);
  soundEnabled = true;
  document.getElementById('sound-hint').classList.add('hidden');
}

/**
 * Classic mechanical “tick” — short broadband click + low wooden body resonance.
 * Alternates slightly between tick and tock for left/right pallet feel.
 */
function playTick(isTock = false) {
  if (!audioCtx || muted || audioCtx.state !== 'running') return;

  const t0 = audioCtx.currentTime;
  const dur = 0.055;

  // 1) Transient click (noise burst through bandpass)
  const bufferSize = Math.floor(audioCtx.sampleRate * 0.012);
  const noiseBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuf;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = isTock ? 1850 : 2400;
  bp.Q.value = 1.8;

  const clickGain = audioCtx.createGain();
  clickGain.gain.setValueAtTime(0.9, t0);
  clickGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.025);

  noise.connect(bp);
  bp.connect(clickGain);
  clickGain.connect(masterGain);
  noise.start(t0);
  noise.stop(t0 + 0.03);

  // 2) Body / plate resonance (short decaying sine)
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = isTock ? 380 : 520;

  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(0.22, t0);
  oscGain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

  // Soft low thump
  const thump = audioCtx.createOscillator();
  thump.type = 'sine';
  thump.frequency.value = isTock ? 95 : 110;
  const thumpGain = audioCtx.createGain();
  thumpGain.gain.setValueAtTime(0.18, t0);
  thumpGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);

  osc.connect(oscGain);
  oscGain.connect(masterGain);
  thump.connect(thumpGain);
  thumpGain.connect(masterGain);

  osc.start(t0);
  osc.stop(t0 + dur + 0.01);
  thump.start(t0);
  thump.stop(t0 + 0.05);
}

// Unlock audio on first user gesture (browser policy)
function unlockAudio() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
['click', 'touchstart', 'keydown'].forEach(evt => {
  window.addEventListener(evt, unlockAudio, { once: true, passive: true });
});

// ═══════════════════════════════════════════════════════════════════════════════
//  MECHANICAL TIMING & GEAR KINEMATICS
// ═══════════════════════════════════════════════════════════════════════════════
/*
  Classic Swiss lever:
  - Escape wheel locked most of the second.
  - Balance impulse unlocks one tooth → second hand jumps.
  - Going train (fourth → third → center) advances smoothly between ticks
    because the power of the mainspring is continuous; the escape only
    releases it in discrete quanta.
*/

let lastSecond = -1;
let tickParity = 0;               // alternates tick / tock

// Second hand: target + spring-damper display
let secondTarget = 0;
let secondDisplay = 0;
let secondVel = 0;
const SEC_STIFFNESS = 0.42;
const SEC_DAMPING   = 0.68;

// Gear angular positions (radians)
const gears = {
  escape: 0,
  fourth: 0,
  third: 0,
  center: 0,
  intermediate: 0,
  balance: 0,
  pallet: 0.35
};

// Tooth counts used for correct relative speeds when meshing
const TEETH = {
  escape: 30,
  fourth: 42,
  third: 48,
  center: 60,
  intermediate: 36
};

// Continuous drive angle derived from real time (smooth flow of the train)
function getTimeState() {
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();

  // Fractional seconds for smooth sub-second motion of the going train
  const secFrac = s + ms / 1000;
  const minFrac = m + secFrac / 60;
  const hourFrac = h + minFrac / 60;

  return { h: hourFrac, m: minFrac, s, ms, secFrac };
}

// ─── Animation ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  const { h, m, s, ms, secFrac } = getTimeState();

  // ── Discrete mechanical tick ──
  if (s !== lastSecond) {
    lastSecond = s;
    secondTarget = (s / 60) * Math.PI * 2;
    secondVel += 0.62;                    // impulse
    gears.escape += (Math.PI * 2) / TEETH.escape;  // one tooth
    gears.pallet = 0.35 + (tickParity % 2 === 0 ? 0.18 : -0.18); // lever flips
    playTick(tickParity % 2 === 1);
    tickParity++;
  }

  // Spring-damper settle of second hand (overshoot → settle)
  let err = secondTarget - secondDisplay;
  err = ((err + Math.PI) % (Math.PI * 2)) - Math.PI; // shortest arc
  secondVel += err * SEC_STIFFNESS;
  secondVel *= SEC_DAMPING;
  secondDisplay += secondVel;

  // ── Smooth continuous motion of the going train ──
  // The train is powered continuously; we advance it proportionally to
  // fractional seconds so gears keep turning smoothly between ticks.
  // Ratios approximate a real going train (visual, not horologically exact).
  const drive = secFrac * Math.PI * 2;           // one full turn per minute base

  // Escape is discrete (already handled); the rest follow smoothly
  // with proper relative tooth ratios so they appear to mesh.
  gears.fourth       = -(drive * (TEETH.escape / TEETH.fourth)) * 0.85;
  gears.third        =  (drive * (TEETH.escape / TEETH.third))  * 0.55;
  gears.center       = -(drive * (TEETH.escape / TEETH.center)) * 0.35;
  gears.intermediate =  (drive * (TEETH.escape / TEETH.intermediate)) * 1.1;

  // Balance wheel: continuous oscillation + extra kick after tick
  const balKick = Math.min(Math.abs(secondVel) * 3.5, 0.55);
  const balAmp  = 0.58 + balKick;
  gears.balance = Math.sin(t * Math.PI * 5.0) * balAmp;   // ~2.5 Hz

  // Pallet slowly returns toward neutral after the flip
  gears.pallet += (0.35 - gears.pallet) * Math.min(1, dt * 4);

  // ── Apply rotations ──
  hourHand.rotation.y   = -(h / 12) * Math.PI * 2;
  minuteHand.rotation.y = -(m / 60) * Math.PI * 2;
  secondHand.rotation.y = -secondDisplay;

  escapeWheel.rotation.y     = -gears.escape;
  fourthWheel.rotation.y     =  gears.fourth;
  thirdWheel.rotation.y      =  gears.third;
  centerWheel.rotation.y     =  gears.center;
  intermediate.rotation.y    =  gears.intermediate;
  balance.rotation.y         =  gears.balance;
  pallet.rotation.y          =  gears.pallet;

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ─── Events ──────────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    camera.position.set(0, 4.5, 22);
    controls.target.set(0, 0, 0);
    controls.update();
  }
  if (e.key === 'm' || e.key === 'M') {
    muted = !muted;
    if (masterGain) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 0.55, audioCtx.currentTime, 0.05);
    }
  }
});
</script>
</body>
</html>
