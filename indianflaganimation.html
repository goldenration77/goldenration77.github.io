<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Independence Day – Animated Tiranga · 24h Cycle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a12;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; padding: 1.75rem 1.25rem;
    }
    .title {
      text-align: center; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.65), 0 0 20px rgba(255,103,31,0.3);
      animation: fadeInDown 1.3s ease-out;
    }
    .title h1 {
      font-size: clamp(1.4rem, 4.2vw, 2.4rem); font-weight: 700;
      letter-spacing: 0.05em; margin-bottom: 0.25rem;
    }
    .title p {
      font-size: clamp(0.8rem, 2vw, 1.1rem); opacity: 0.95;
      letter-spacing: 0.16em; text-transform: uppercase;
    }

    .clock-panel {
      position: fixed; top: 1.25rem; left: 1.25rem; z-index: 4;
      background: rgba(0, 20, 40, 0.55); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px; padding: 0.85rem 1.15rem;
      backdrop-filter: blur(12px); color: #fff; pointer-events: auto;
      min-width: 170px; box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      animation: fadeInDown 1.1s ease-out;
    }
    .clock-time {
      font-size: 1.85rem; font-weight: 600;
      font-variant-numeric: tabular-nums; letter-spacing: 0.04em; line-height: 1.1;
    }
    .clock-period {
      font-size: 0.78rem; opacity: 0.85; margin-top: 0.15rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .clock-bar {
      margin-top: 0.55rem; height: 5px; background: rgba(255,255,255,0.15);
      border-radius: 3px; overflow: hidden;
    }
    .clock-bar-fill {
      height: 100%; width: 0%; border-radius: 3px;
      background: linear-gradient(90deg, #FF671F, #FFD700, #046A38);
      transition: width 0.3s linear;
    }
    .clock-speed { margin-top: 0.45rem; font-size: 0.7rem; opacity: 0.7; }

    .footer {
      text-align: center; color: rgba(255,255,255,0.88);
      font-size: clamp(0.68rem, 1.7vw, 0.88rem);
      text-shadow: 0 1px 4px rgba(0,0,0,0.55);
      animation: fadeInUp 1.5s ease-out; max-width: 92%;
    }

    .controls {
      position: fixed; bottom: 1.15rem; right: 1.15rem; z-index: 3;
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      pointer-events: auto; justify-content: flex-end; max-width: 90vw;
    }
    .btn {
      background: rgba(0,30,60,0.5); border: 1px solid rgba(255,255,255,0.28);
      color: #fff; padding: 0.48rem 0.85rem; border-radius: 999px;
      cursor: pointer; font-size: 0.78rem; backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: rgba(0,45,90,0.7); transform: translateY(-1px); }
    .btn.active { background: rgba(255,103,31,0.55); border-color: rgba(255,200,100,0.5); }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="clock-panel">
    <div class="clock-time" id="clock-time">06:00</div>
    <div class="clock-period" id="clock-period">Sunrise</div>
    <div class="clock-bar"><div class="clock-bar-fill" id="clock-bar"></div></div>
    <div class="clock-speed" id="clock-speed">1 day ≈ 2 min</div>
  </div>

  <div class="overlay">
    <div class="title">
      <h1>🇮🇳 Happy Independence Day</h1>
      <p>15 August · Jai Hind</p>
    </div>
    <div class="footer">
      Accurate Tiranga (3:2) · Clear flag · Sun travels East → West
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-wave">Toggle Wave</button>
    <button class="btn" id="btn-wind">Stronger Wind</button>
    <button class="btn" id="btn-pause">Pause Time</button>
    <button class="btn" id="btn-speed">Speed ×2</button>
    <button class="btn" id="btn-cam">Reset Camera</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    // Official colours (Wikipedia / BIS)
    const SAFFRON = '#FF671F';
    const WHITE   = '#FFFFFF';
    const GREEN   = '#046A38';
    const NAVY    = '#06038D';

    const FLAG_W = 3.6;
    const FLAG_H = 2.4;
    const SEG_X = 80, SEG_Y = 50;
    const CHAKRA_DIAM_RATIO = 0.308;

    // ---------- Renderer ----------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 600);
    camera.position.set(5.5, 3.5, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 3.0, 0);

    // ---------- Sky (atmospheric scattering, mild settings) ----------
    const sky = new Sky();
    sky.scale.setScalar(450);
    scene.add(sky);
    const sun = new THREE.Vector3();
    const skyU = sky.material.uniforms;
    skyU['turbidity'].value = 2.2;
    skyU['rayleigh'].value = 1.4;
    skyU['mieCoefficient'].value = 0.0035;
    skyU['mieDirectionalG'].value = 0.8;

    // Almost no fog during day — flag stays sharp
    scene.fog = new THREE.FogExp2(0x88aacc, 0.001);

    // ---------- Visible sun disc + glow (makes East→West obvious) ----------
    const sunDisc = new THREE.Mesh(
      new THREE.SphereGeometry(5, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, opacity: 1, depthWrite: false, fog: false })
    );
    scene.add(sunDisc);

    const glowC = document.createElement('canvas');
    glowC.width = 128; glowC.height = 128;
    const gx = glowC.getContext('2d');
    const g = gx.createRadialGradient(64, 64, 2, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,250,210,1)');
    g.addColorStop(0.2, 'rgba(255,210,100,0.45)');
    g.addColorStop(1, 'rgba(255,100,30,0)');
    gx.fillStyle = g; gx.fillRect(0, 0, 128, 128);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glowC),
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false
    }));
    sunGlow.scale.set(60, 60, 1);
    scene.add(sunGlow);

    // ---------- Lights ----------
    const hemi = new THREE.HemisphereLight(0xb0d8ff, 0x3a2a18, 0.5);
    scene.add(hemi);

    const dirLight = new THREE.DirectionalLight(0xfff5e0, 1.8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 100;
    dirLight.shadow.camera.left = -22;
    dirLight.shadow.camera.right = 22;
    dirLight.shadow.camera.top = 22;
    dirLight.shadow.camera.bottom = -22;
    dirLight.shadow.bias = -0.0003;
    scene.add(dirLight);

    const nightFill = new THREE.DirectionalLight(0x5577bb, 0);
    nightFill.position.set(-8, 12, -6);
    scene.add(nightFill);

    const amb = new THREE.AmbientLight(0x7090c0, 0.12);
    scene.add(amb);

    // ---------- Ground & scenery ----------
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(60, 64),
      new THREE.MeshStandardMaterial({ color: 0x3a7a2a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const plaza = new THREE.Mesh(
      new THREE.CylinderGeometry(3.2, 3.4, 0.18, 48),
      new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.75 })
    );
    plaza.position.y = 0.09;
    plaza.receiveShadow = true;
    plaza.castShadow = true;
    scene.add(plaza);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.55, 0.06, 8, 48),
      new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.6, roughness: 0.35 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.19;
    scene.add(ring);

    function hill(x, z, sx, sy, sz, col) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(1, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.5),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.95 })
      );
      m.scale.set(sx, sy, sz);
      m.position.set(x, 0, z);
      m.receiveShadow = true;
      scene.add(m);
    }
    hill(-22, -28, 14, 5.5, 10, 0x4a7c3a);
    hill(18, -32, 16, 6.5, 12, 0x3d6b32);
    hill(5, -38, 20, 4, 14, 0x456b38);
    hill(-30, -18, 10, 4.2, 8, 0x527a40);

    function tree(x, z, h) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.12, h * 0.35, 6),
        new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.9 })
      );
      trunk.position.set(x, h * 0.175, z);
      trunk.castShadow = true;
      scene.add(trunk);
      const leaf = new THREE.Mesh(
        new THREE.ConeGeometry(0.55 + Math.random() * 0.2, h * 0.75, 7),
        new THREE.MeshStandardMaterial({ color: 0x2d6b28, roughness: 0.85 })
      );
      leaf.position.set(x, h * 0.55, z);
      leaf.castShadow = true;
      scene.add(leaf);
    }
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + Math.random() * 0.3;
      const r = 10 + Math.random() * 14;
      tree(Math.cos(a) * r, Math.sin(a) * r, 1.8 + Math.random() * 1.5);
    }

    // ---------- Flag mast ----------
    const mast = new THREE.Group();
    scene.add(mast);
    const poleH = 7.2;

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.078, poleH, 20),
      new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.7, roughness: 0.28 })
    );
    pole.position.y = poleH / 2;
    pole.castShadow = true;
    mast.add(pole);

    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.85, roughness: 0.25 })
    );
    ball.position.y = poleH + 0.05;
    mast.add(ball);

    const finial = new THREE.Mesh(
      new THREE.ConeGeometry(0.035, 0.22, 8),
      new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.85, roughness: 0.25 })
    );
    finial.position.y = poleH + 0.18;
    mast.add(finial);

    const base1 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.32, 0.38, 0.28, 24),
      new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.35, roughness: 0.5 })
    );
    base1.position.y = 0.14;
    base1.castShadow = true;
    mast.add(base1);

    const base2 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.22, 0.28, 0.22, 20),
      new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.4, roughness: 0.45 })
    );
    base2.position.y = 0.38;
    base2.castShadow = true;
    mast.add(base2);

    const step = new THREE.Mesh(
      new THREE.CylinderGeometry(1.15, 1.25, 0.12, 32),
      new THREE.MeshStandardMaterial({ color: 0x6a6a6a, roughness: 0.7 })
    );
    step.position.y = 0.06;
    step.receiveShadow = true;
    mast.add(step);

    // ---------- Flag texture (accurate 3:2) ----------
    function makeFlagTex() {
      const w = 1200, h = 800;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const bh = h / 3;
      ctx.fillStyle = SAFFRON; ctx.fillRect(0, 0, w, bh);
      ctx.fillStyle = WHITE;   ctx.fillRect(0, bh, w, bh);
      ctx.fillStyle = GREEN;   ctx.fillRect(0, bh * 2, w, bh);

      const cx = w / 2, cy = h / 2;
      const R = (h * CHAKRA_DIAM_RATIO) / 2;
      const r = R * 0.16;
      ctx.strokeStyle = NAVY; ctx.fillStyle = NAVY;
      ctx.lineWidth = Math.max(2.5, R * 0.04); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2 - Math.PI / 2;
        const cos = Math.cos(a), sin = Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(cx + cos * (r + 1), cy + sin * (r + 1));
        ctx.lineTo(cx + cos * (R - 1), cy + sin * (R - 1));
        ctx.stroke();
        const tR = R - R * 0.07, tW = R * 0.055;
        const px = cx + cos * tR, py = cy + sin * tR;
        const ox = -sin * tW, oy = cos * tW;
        ctx.beginPath();
        ctx.moveTo(cx + cos * R, cy + sin * R);
        ctx.lineTo(px + ox, py + oy);
        ctx.lineTo(px - ox, py - oy);
        ctx.closePath(); ctx.fill();
      }
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 8;
        d[i] = Math.min(255, Math.max(0, d[i] + n));
        d[i+1] = Math.min(255, Math.max(0, d[i+1] + n));
        d[i+2] = Math.min(255, Math.max(0, d[i+2] + n));
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    const geo = new THREE.PlaneGeometry(FLAG_W, FLAG_H, SEG_X, SEG_Y);
    const orig = new Float32Array(geo.attributes.position.array);
    orig.set(geo.attributes.position.array);

    const flag = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      map: makeFlagTex(), side: THREE.DoubleSide, roughness: 0.75, metalness: 0.02
    }));
    flag.position.set(FLAG_W / 2 + 0.04, poleH * 0.72, 0.02);
    flag.castShadow = true;
    flag.receiveShadow = true;
    scene.add(flag);

    // ---------- Wave ----------
    let waveOn = true, wind = 1.0;
    function applyWave(t) {
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const ix = i * 3;
        const x = orig[ix], y = orig[ix + 1];
        const u = x / FLAG_W + 0.5, v = y / FLAG_H + 0.5;
        const e = Math.pow(Math.max(0, u), 1.4);
        const w1 = Math.sin(u * 8.5 + t * 2.9 * wind) * 0.13;
        const w2 = Math.sin(u * 4.2 - t * 1.9 * wind + v * 2.8) * 0.07;
        const w3 = Math.sin(u * 13 + t * 4.1 * wind + v * 1.4) * 0.035;
        const w4 = Math.sin(u * 2 + t * 1.1 * wind) * 0.04;
        pos.array[ix] = x;
        pos.array[ix + 1] = y + Math.sin(u * 5.5 + t * 2.2 * wind) * 0.022 * e * wind;
        pos.array[ix + 2] = (w1 + w2 + w3 + w4) * e * wind;
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
    }

    // ---------- Particles ----------
    const PC = 60;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PC * 3);
    const pCol = new Float32Array(PC * 3);
    const cols = [new THREE.Color(SAFFRON), new THREE.Color(0xffffff), new THREE.Color(GREEN), new THREE.Color(NAVY)];
    for (let i = 0; i < PC; i++) {
      pPos[i*3] = (Math.random()-0.5)*28;
      pPos[i*3+1] = 1 + Math.random()*11;
      pPos[i*3+2] = (Math.random()-0.5)*28;
      const c = cols[i % 4];
      pCol[i*3] = c.r; pCol[i*3+1] = c.g; pCol[i*3+2] = c.b;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.055, vertexColors: true, transparent: true, opacity: 0.35,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(particles);

    // ============================================================
    // 24h CYCLE — visible sun travels East → West
    // ============================================================
    let simMin = 6 * 60;
    let paused = false;
    let scale = 1;
    const MPS = 12; // sim-minutes per real second at 1×

    const elTime = document.getElementById('clock-time');
    const elPeriod = document.getElementById('clock-period');
    const elBar = document.getElementById('clock-bar');
    const elSpeed = document.getElementById('clock-speed');

    const _col = new THREE.Color();

    function period(h) {
      if (h >= 5 && h < 7) return 'Sunrise';
      if (h >= 7 && h < 11) return 'Morning';
      if (h >= 11 && h < 14) return 'Noon';
      if (h >= 14 && h < 17) return 'Afternoon';
      if (h >= 17 && h < 19) return 'Sunset';
      if (h >= 19 && h < 21) return 'Dusk';
      return 'Night';
    }

    function smooth(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function updateSky(dt) {
      if (!paused) {
        simMin += dt * MPS * scale;
        if (simMin >= 1440) simMin -= 1440;
      }

      const h = Math.floor(simMin / 60) % 24;
      const m = Math.floor(simMin % 60);
      elTime.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      elPeriod.textContent = period(h);
      elBar.style.width = `${(simMin / 1440) * 100}%`;

      // ---- Solar geometry: clear East → South → West ----
      // 0.0 = midnight, 0.25 = 06:00, 0.5 = noon, 0.75 = 18:00
      const f = simMin / 1440;

      // Elevation: sine arc, peak at noon
      let elev = Math.sin((f - 0.25) * Math.PI * 2) * 70;
      if (elev < -8) elev = -8 - (elev + 8) * 0.25; // soft night floor

      // Azimuth: 90° East at sunrise → 180° South at noon → 270° West at sunset
      let az;
      if (f >= 0.22 && f <= 0.78) {
        az = 90 + ((f - 0.22) / 0.56) * 180;
      } else if (f < 0.22) {
        az = 75 + f * 70;
      } else {
        az = 270 + (f - 0.78) * 70;
      }

      const phi = THREE.MathUtils.degToRad(90 - elev);
      const theta = THREE.MathUtils.degToRad(az);
      sun.setFromSphericalCoords(1, phi, theta);
      skyU['sunPosition'].value.copy(sun);

      // Visible disc far away in the same direction
      const dist = 360;
      sunDisc.position.copy(sun).multiplyScalar(dist);
      sunGlow.position.copy(sunDisc.position);

      // ---- Mild atmosphere (flag stays clear) ----
      const up = smooth(-3, 8, elev);          // 0 below horizon → 1 fully up
      const horiz = 1 - smooth(4, 30, elev);   // near horizon
      const elevN = smooth(-5, 55, elev);

      skyU['turbidity'].value = 1.8 + horiz * 3.5;
      skyU['rayleigh'].value = 1.15 + elevN * 1.1;
      skyU['mieCoefficient'].value = 0.0028 + horiz * 0.008;
      skyU['mieDirectionalG'].value = 0.8;

      // Direct light follows the sun
      const red = horiz * 0.9;
      _col.setHSL(0.11 - red * 0.07, 0.5 + red * 0.35, 0.55 + up * 0.25 - red * 0.08);
      dirLight.color.copy(_col);
      dirLight.intensity = 0.25 + up * 1.75;
      dirLight.position.copy(sun).multiplyScalar(55);

      // Sun disc look
      const show = elev > -4;
      sunDisc.visible = show;
      sunGlow.visible = elev > -6;
      sunDisc.material.color.copy(_col);
      sunDisc.material.opacity = Math.min(1, up * 1.3);
      sunGlow.material.opacity = 0.25 + up * 0.65 + horiz * 0.35;
      sunGlow.scale.setScalar(45 + horiz * 40);

      // Skylight
      hemi.intensity = 0.22 + elevN * 0.38;
      hemi.color.setHSL(0.58 - horiz * 0.08, 0.4, 0.5 + elevN * 0.2);
      hemi.groundColor.setHSL(0.09, 0.28, 0.14 + elevN * 0.1);
      amb.intensity = 0.08 + elevN * 0.1;
      nightFill.intensity = (1 - up) * 0.3;

      // Fog: nearly zero in daytime
      scene.fog.color.setHSL(0.55 - horiz * 0.15, 0.2, 0.5 + elevN * 0.2);
      scene.fog.density = 0.0006 + (1 - elevN) * 0.0035;

      renderer.toneMappingExposure = 0.75 + elevN * 0.35;
      particles.material.opacity = 0.12 + elevN * 0.28;
    }

    // ---------- UI ----------
    document.getElementById('btn-wave').onclick = () => { waveOn = !waveOn; };
    document.getElementById('btn-wind').onclick = () => { wind = wind > 1.4 ? 0.7 : wind + 0.4; };
    document.getElementById('btn-pause').onclick = (e) => {
      paused = !paused;
      e.target.textContent = paused ? 'Resume Time' : 'Pause Time';
      e.target.classList.toggle('active', paused);
    };
    document.getElementById('btn-speed').onclick = (e) => {
      const s = [1, 2, 4, 8];
      scale = s[(s.indexOf(scale) + 1) % s.length];
      e.target.textContent = `Speed ×${scale}`;
      const sec = 1440 / (MPS * scale);
      elSpeed.textContent = `1 day ≈ ${sec < 60 ? sec.toFixed(0) + 's' : (sec/60).toFixed(1) + ' min'}`;
    };
    document.getElementById('btn-cam').onclick = () => {
      camera.position.set(5.5, 3.5, 8.5);
      controls.target.set(0, 3.0, 0);
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    let t = 0;
    function frame() {
      requestAnimationFrame(frame);
      const dt = clock.getDelta();
      t += dt;
      updateSky(dt);
      if (waveOn) applyWave(t);
      const pp = particles.geometry.attributes.position;
      for (let i = 0; i < PC; i++) {
        pp.array[i*3+1] += Math.sin(t * 0.5 + i) * 0.002;
        pp.array[i*3] += Math.cos(t * 0.3 + i * 0.5) * 0.001;
      }
      pp.needsUpdate = true;
      controls.update();
      renderer.render(scene, camera);
    }
    frame();

    elSpeed.textContent = '1 day ≈ 2 min';
    console.log('%c🇮🇳 Jai Hind — Clear flag · Sun moves East → West', 'color:#FF671F;font-weight:bold;font-size:14px');
  </script>
</body>
</html>
